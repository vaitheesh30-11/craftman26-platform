name: adapters-ci

on:
  push:
    branches: [main, staging]
    paths:
      - "adapters/**"
      - ".github/workflows/adapters-ci.yml"
  pull_request:
    paths:
      - "adapters/**"
      - ".github/workflows/adapters-ci.yml"

defaults:
  run:
    working-directory: adapters

env:
  UV_LOCKED: "1"

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
      - run: uv sync --all-groups
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests

  type:
    name: type (mypy --strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
      - run: uv sync --all-groups
      - run: uv run mypy --strict src

  test:
    name: test (pytest + coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
      - run: uv sync --all-groups
      - run: uv run pytest tests -v --junitxml=junit.xml --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adapters-test-results
          path: |
            adapters/junit.xml
            adapters/coverage.xml
      - name: Upload coverage to Codecov
        if: github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v4
        with:
          files: adapters/coverage.xml
          flags: adapters
          token: ${{ secrets.CODECOV_TOKEN }}

  security:
    name: security (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
      - run: uv sync --all-groups
      - run: uvx pip-audit --local
