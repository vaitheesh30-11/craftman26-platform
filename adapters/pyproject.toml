[project]
name = "iam-sentinel-adapters"
version = "0.1.0"
description = "AWS API adapters and cryptographic utilities for IAM Sentinel"
requires-python = ">=3.12,<3.13"
readme = "README.md"
authors = [{ name = "IAM Sentinel" }]

dependencies = [
    "aws-lambda-powertools[all]==3.2.0",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "boto3==1.35.36",
    "botocore==1.35.36",
    "tenacity==8.5.0",
]

[dependency-groups]
dev = [
    "pytest==8.3.3",
    "pytest-cov==5.0.0",
    "moto[all]==5.0.16",
    "ruff==0.6.9",
    "mypy==1.11.2",
    "types-boto3==1.0.2",
    "boto3-stubs[dynamodb,kms,s3,iam,ssm,bedrock-runtime,bedrock-agent-runtime]==1.35.36",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iam_sentinel_adapters"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",
    "I",
    "N",
    "UP",
    "B",
    "SIM",
    "TCH",
    "PL",
    "RUF",
    "ARG",
    "ASYNC",
    "S",
    "BLE",
]
ignore = [
    "E501",
    "PLR0913",
    "S101",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004", "ARG"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic_settings.BaseSettings"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true

[tool.pytest.ini_options]
addopts = "--cov=iam_sentinel_adapters --cov-report=term-missing"
testpaths = ["tests"]
