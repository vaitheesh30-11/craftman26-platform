[project]
name = "iam-sentinel-infra"
version = "0.1.0"
description = "AWS CDK v2 (Python) infrastructure for IAM Sentinel"
requires-python = ">=3.12,<3.13"
readme = "README.md"
authors = [{ name = "IAM Sentinel" }]

dependencies = [
    "aws-cdk-lib==2.163.0",
    "constructs==10.4.0",
    "cdk-nag==2.28.187",
    "pydantic==2.9.2",
    "pyyaml==6.0.2",
]

[dependency-groups]
dev = [
    "pytest==8.3.3",
    "pytest-cov==5.0.0",
    "ruff==0.6.9",
    "mypy==1.11.2",
    "types-pyyaml==6.0.12.20240917",
    "boto3==1.35.36",
    "boto3-stubs[dynamodb,sts,bedrock]==1.35.36",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iam_sentinel_infra"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "functions"]

[tool.ruff.lint]
select = [
    "E", "F", "W",
    "I",
    "N",
    "UP",
    "B",
    "SIM",
    "TCH",
    "PL",
    "RUF",
    "ARG",
    "S",
    "BLE",
]
ignore = [
    "E501",
    "PLR0913",
    "S101",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "ARG"]
"app.py" = ["ARG002"]
"src/iam_sentinel_infra/stacks/*.py" = ["ARG002"]
"functions/**" = ["ARG001"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true

[[tool.mypy.overrides]]
module = ["cdk_nag.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--cov=iam_sentinel_infra --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["functions/guardrail_lifecycle", "functions/break_glass"]
